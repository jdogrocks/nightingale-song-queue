services:
  nightingale-queue:
    build: .
    container_name: nightingale-queue
    restart: unless-stopped
    ports:
      - "7464:7464"
    volumes:
      - nightingale-queue-data:/data
    environment:
      # How the CONTAINER reaches Nightingale (stays inside Docker's network).
      NIGHTINGALE_URL: http://host.docker.internal:64448
      # A container cannot see the host's LAN IP, so set LAN_IP in .env when
      # you change networks — that is the only per-venue edit. See .env.example.
      # Unset LAN_IP leaves GUEST_URL empty, and the QR falls back to the
      # address the VJ page was opened with.
      GUEST_URL: ${LAN_IP:+http://${LAN_IP}:7464}
      NIGHTINGALE_PUBLIC_URL: ${LAN_IP:+http://${LAN_IP}:64448}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  nightingale-queue-data:
